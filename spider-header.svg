<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 230" width="100%" height="100%">
  <defs>
    <!-- Background Gradients (Deep Carbon Obsidian, Crimson & Cyan Ambient) -->
    <linearGradient id="spiderBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06080d" />
      <stop offset="45%" stop-color="#0b0e17" />
      <stop offset="85%" stop-color="#120914" />
      <stop offset="100%" stop-color="#080d1a" />
    </linearGradient>

    <!-- Glowing Spider Crimson Gradient -->
    <linearGradient id="crimsonNeon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff1744" />
      <stop offset="50%" stop-color="#d50000" />
      <stop offset="100%" stop-color="#9b0000" />
    </linearGradient>

    <!-- TASM Iconic Crimson Gradient -->
    <linearGradient id="tasmRedGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="12%" stop-color="#ff3d5a" />
      <stop offset="45%" stop-color="#ff1744" />
      <stop offset="80%" stop-color="#b7001e" />
      <stop offset="100%" stop-color="#700010" />
    </linearGradient>

    <!-- Electric Cyan Spider-Sense Gradient -->
    <linearGradient id="cyanSense" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="50%" stop-color="#00a8ff" />
      <stop offset="100%" stop-color="#0044ff" />
    </linearGradient>

    <!-- Outer Border Cyber Gradient -->
    <linearGradient id="spiderBorderGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff1744" stop-opacity="0.9" />
      <stop offset="35%" stop-color="#ff0055" stop-opacity="0.7" />
      <stop offset="70%" stop-color="#00f0ff" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#7928ca" stop-opacity="0.9" />
    </linearGradient>

    <!-- Title Gradient (Bright White into Spider Crimson & Gold) -->
    <linearGradient id="titleSpiderGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="40%" stop-color="#ffebee" />
      <stop offset="75%" stop-color="#ff5252" />
      <stop offset="100%" stop-color="#ff1744" />
    </linearGradient>

    <!-- Subtitle Cyan Gradient -->
    <linearGradient id="subCyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e0f7fa" />
      <stop offset="50%" stop-color="#80deea" />
      <stop offset="100%" stop-color="#00e5ff" />
    </linearGradient>

    <!-- Filters for TASM Neon Glow -->
    <filter id="tasmGlowFilter" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="3.5" result="blur1" />
      <feGaussianBlur stdDeviation="8" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="crimsonGlowFilter" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="3" result="blur1" />
      <feGaussianBlur stdDeviation="7" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="cyanGlowFilter" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="2.5" result="blur1" />
      <feGaussianBlur stdDeviation="6" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="ambientSpiderGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="35" />
    </filter>

    <!-- Hexagonal Spider-Web Carbon Texture -->
    <pattern id="hexWebGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 40 10 L 40 30 L 20 40 L 0 30 L 0 10 Z" fill="none" stroke="#ffffff" stroke-width="0.35" stroke-opacity="0.04" />
      <line x1="20" y1="0" x2="20" y2="40" stroke="#00f0ff" stroke-width="0.3" stroke-opacity="0.03" />
      <line x1="0" y1="10" x2="40" y2="30" stroke="#ff1744" stroke-width="0.3" stroke-opacity="0.03" />
    </pattern>

    <!-- Animated Clip Path for Typewriter Text -->
    <clipPath id="spiderTypewriterClip">
      <rect x="0" y="140" width="0" height="30">
        <animate attributeName="width"
                 values="0; 0; 570; 570; 570; 0"
                 keyTimes="0; 0.04; 0.52; 0.88; 0.96; 1"
                 dur="8.5s"
                 repeatCount="indefinite" />
      </rect>
    </clipPath>

    <!-- Clip Container for Header -->
    <clipPath id="headerBoxClip">
      <rect width="920" height="230" rx="16" />
    </clipPath>
  </defs>

  <style>
    /* TASM Organic Breathing and Pulse */
    @keyframes tasmBreathing {
      0%, 100% {
        transform: scale(1);
        filter: drop-shadow(0 0 10px rgba(255, 23, 68, 0.75));
      }
      50% {
        transform: scale(1.03);
        filter: drop-shadow(0 0 20px rgba(255, 23, 68, 0.95)) drop-shadow(0 0 30px rgba(0, 240, 255, 0.6));
      }
    }

    /* Spider-Sense Pulse Waves */
    @keyframes spiderPulse1 {
      0% { r: 25px; opacity: 0.9; stroke-width: 2px; }
      50% { opacity: 0.5; }
      100% { r: 92px; opacity: 0; stroke-width: 0.5px; }
    }
    @keyframes spiderPulse2 {
      0% { r: 15px; opacity: 1; stroke-width: 2.2px; }
      50% { opacity: 0.6; }
      100% { r: 80px; opacity: 0; stroke-width: 0.5px; }
    }
    @keyframes spiderPulse3 {
      0% { r: 35px; opacity: 0.8; stroke-width: 1.6px; }
      50% { opacity: 0.4; }
      100% { r: 105px; opacity: 0; stroke-width: 0.4px; }
    }

    /* Web Strand Glow */
    @keyframes tasmWebGlow {
      0%, 100% { stroke-opacity: 0.25; }
      50% { stroke-opacity: 0.6; stroke: #00f0ff; }
    }

    /* Cursor Blink */
    @keyframes blinkSpiderCursor {
      0%, 48% { opacity: 1; }
      50%, 98% { opacity: 0; }
      100% { opacity: 1; }
    }

    .tasm-emblem-anim {
      transform-origin: 785px 115px;
      animation: tasmBreathing 4.5s ease-in-out infinite;
    }

    .pulse-ring-1 {
      animation: spiderPulse1 3.2s cubic-bezier(0.1, 0.6, 0.3, 1) infinite;
    }
    .pulse-ring-2 {
      animation: spiderPulse2 3.2s cubic-bezier(0.1, 0.6, 0.3, 1) 1.1s infinite;
    }
    .pulse-ring-3 {
      animation: spiderPulse3 3.2s cubic-bezier(0.1, 0.6, 0.3, 1) 2.1s infinite;
    }

    .tasm-web-strand {
      animation: tasmWebGlow 5s ease-in-out infinite;
    }

    .cursor-neon {
      animation: blinkSpiderCursor 0.85s step-end infinite;
    }

    /* Typography Classes */
    .font-title {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', Roboto, sans-serif;
      font-weight: 900;
      letter-spacing: -0.6px;
    }
    .font-sub {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', Roboto, sans-serif;
      font-weight: 600;
      letter-spacing: 0.3px;
    }
    .font-typewriter {
      font-family: 'SF Mono', Monaco, Consolas, 'Liberation Mono', 'Courier New', monospace;
      font-size: 12px;
      font-weight: 500;
      letter-spacing: 0.2px;
    }
    .font-diag {
      font-family: 'SF Mono', Monaco, Consolas, 'Liberation Mono', 'Courier New', monospace;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.8px;
    }
  </style>

  <!-- Main Container -->
  <rect width="920" height="230" rx="16" fill="url(#spiderBg)" stroke="url(#spiderBorderGrad)" stroke-width="1.4" />

  <!-- Hexagonal Spider-Web Carbon Texture -->
  <rect width="920" height="230" rx="16" fill="url(#hexWebGrid)" clip-path="url(#headerBoxClip)" />

  <!-- Ambient Spider Glow Orbs -->
  <g clip-path="url(#headerBoxClip)">
    <circle cx="120" cy="40" r="90" fill="#ff1744" opacity="0.12" filter="url(#ambientSpiderGlow)" />
    <circle cx="785" cy="115" r="130" fill="#ff1744" opacity="0.14" filter="url(#ambientSpiderGlow)" />
    <circle cx="450" cy="220" r="80" fill="#00f0ff" opacity="0.08" filter="url(#ambientSpiderGlow)" />
  </g>

  <!-- Left Cyber Border Accent & Spider Silk Thread -->
  <g clip-path="url(#headerBoxClip)">
    <!-- High-Tech Neon Vertical Accent Bar -->
    <rect x="36" y="44" width="4.5" height="152" rx="2.25" fill="url(#spiderBorderGrad)" filter="url(#crimsonGlowFilter)" opacity="0.9" />
    <line x1="38.25" y1="44" x2="38.25" y2="196" stroke="#ffffff" stroke-width="1.2" opacity="0.8" />
  </g>

  <!-- ======================================================== -->
  <!-- LEFT CONTENT: NOTHING ABOVE JOSE REGISH J                -->
  <!-- ======================================================== -->
  <g transform="translate(58, 0)">
    <!-- Main Title: JOSE REGISH J (NOTHING ABOVE THIS) -->
    <text x="0" y="86" fill="url(#titleSpiderGrad)" font-size="44" class="font-title">
      JOSE REGISH J <tspan fill="#00f0ff" font-size="34">🕷️</tspan>
    </text>

    <!-- Subtitle: Web3 & Blockchain Focus (No "Full-Stack") -->
    <text x="0" y="122" fill="#e2e8f0" font-size="15" class="font-sub">
      <tspan font-weight="700" fill="#ffffff">Web3 &amp; Blockchain Engineer</tspan>
      <tspan fill="#ff1744"> ◈ </tspan>
      <tspan fill="#00f0ff">Solidity &amp; Smart Contracts</tspan>
      <tspan fill="#ff1744"> ◈ </tspan>
      <tspan fill="#ffd700">DApps Architecture</tspan>
    </text>

    <!-- Typewriter Animated Quote Bar (No "Full-Stack", No "EVM") -->
    <g clip-path="url(#spiderTypewriterClip)">
      <text x="0" y="158" fill="#f1f5f9" class="font-typewriter" textLength="565" lengthAdjust="spacing">
        &gt; Architecting decentralized Web3 protocols, Solidity smart contracts &amp; modern DApps.
      </text>
    </g>

    <!-- Blinking Neon Cyan Cursor tracking typing edge -->
    <g>
      <animateTransform attributeName="transform" type="translate"
                        values="0,0; 0,0; 568,0; 568,0; 568,0; 0,0"
                        keyTimes="0; 0.04; 0.52; 0.88; 0.96; 1"
                        dur="8.5s"
                        repeatCount="indefinite" />
      <rect x="0" y="144" width="2.5" height="17" fill="#00f0ff" rx="1.2" class="cursor-neon" filter="url(#cyanGlowFilter)">
        <animate attributeName="opacity"
                 values="1; 1; 0; 0; 1"
                 keyTimes="0; 0.45; 0.5; 0.95; 1"
                 dur="0.85s"
                 repeatCount="indefinite" />
      </rect>
    </g>

    <!-- Live Telemetry Strip (No "Full-Stack", No "EVM") -->
    <g transform="translate(0, 194)">
      <!-- Item 1: Spider Sense -->
      <circle cx="4" cy="-3" r="3" fill="#ff1744" />
      <text x="12" y="0" fill="#94a3b8" class="font-diag">
        <tspan fill="#ff1744" font-weight="700">SPIDER-SENSE:</tspan> 100% ONLINE
      </text>

      <!-- Item 2: Blockchain / Solidity -->
      <circle cx="180" cy="-3" r="3" fill="#00f0ff" />
      <text x="188" y="0" fill="#94a3b8" class="font-diag">
        <tspan fill="#00f0ff" font-weight="700">BLOCKCHAIN:</tspan> SOLIDITY
      </text>

      <!-- Item 3: DApps & Contracts -->
      <circle cx="340" cy="-3" r="3" fill="#ffd700" />
      <text x="348" y="0" fill="#94a3b8" class="font-diag">
        <tspan fill="#ffd700" font-weight="700">CONTRACTS:</tspan> AUDITED &amp; DEPLOYED
      </text>
    </g>
  </g>

  <!-- ======================================================== -->
  <!-- RIGHT CONTENT: THE AMAZING SPIDER-MAN (TASM) SPIDER LOGO -->
  <!-- ======================================================== -->
  <g transform="translate(785, 115)">
    <!-- 1. Ambient Expanding Spider-Sense Pulse Waves -->
    <circle cx="0" cy="0" r="30" fill="none" stroke="#ff1744" opacity="0" class="pulse-ring-1" filter="url(#crimsonGlowFilter)" />
    <circle cx="0" cy="0" r="20" fill="none" stroke="#00f0ff" opacity="0" class="pulse-ring-2" filter="url(#cyanGlowFilter)" />
    <circle cx="0" cy="0" r="40" fill="none" stroke="#ff0055" opacity="0" class="pulse-ring-3" />

    <!-- 2. Organic Concentric Web Strands (TASM Suit Pattern) -->
    <g class="tasm-web-strand" stroke="#ff1744" stroke-width="0.75" opacity="0.35">
      <!-- Concentric web rings -->
      <path d="M -70,-30 Q 0,-65 70,-30" fill="none" />
      <path d="M -80,0 Q 0,-25 80,0" fill="none" />
      <path d="M -75,35 Q 0,15 75,35" fill="none" />
      <path d="M -60,65 Q 0,45 60,65" fill="none" />

      <!-- Subtle radial strands -->
      <line x1="0" y1="-80" x2="0" y2="85" stroke-dasharray="3 3" />
      <line x1="-75" y1="-45" x2="75" y2="45" stroke-dasharray="3 3" />
      <line x1="-75" y1="45" x2="75" y2="-45" stroke-dasharray="3 3" />
    </g>

    <!-- 3. THE AMAZING SPIDER-MAN ICONIC EMBLEM (Sleek, Organic, Needle Legs) -->
    <g class="tasm-emblem-anim" filter="url(#tasmGlowFilter)">
      <!-- Central Body: Sharp Head, Diamond Thorax & Needle-tapered Abdomen -->
      <!-- Head -->
      <polygon points="0,-38 5.5,-30 0,-26 -5.5,-30" fill="url(#tasmRedGrad)" stroke="#ffffff" stroke-width="0.6" />

      <!-- Thorax (Upper Chest diamond) -->
      <polygon points="0,-24 8,-14 0,-3 -8,-14" fill="url(#tasmRedGrad)" stroke="#ffffff" stroke-width="0.6" />

      <!-- Abdomen (Long, slender, needle-tapered lower abdomen) -->
      <polygon points="0,-2 6,10 0,38 -6,10" fill="url(#tasmRedGrad)" stroke="#ffffff" stroke-width="0.6" />

      <!-- Center spine highlight -->
      <line x1="0" y1="-34" x2="0" y2="34" stroke="#ffffff" stroke-width="0.9" opacity="0.7" />

      <!-- ============================================== -->
      <!-- THE 8 SIGNATURE AMAZING SPIDER-MAN LEGS        -->
      <!-- ============================================== -->

      <!-- PAIR 1 (TOP LEGS): Sickle-shaped, arching high up and out with sharp tips -->
      <!-- Left Top Leg -->
      <path d="M -4,-21 C -12,-38 -22,-58 -32,-74 C -33.5,-76 -35,-74.5 -33.5,-73 C -25,-55 -16,-34 -2,-17 Z" 
            fill="url(#tasmRedGrad)" stroke="#ffffff" stroke-width="0.4" />
      <!-- Right Top Leg -->
      <path d="M 4,-21 C 12,-38 22,-58 32,-74 C 33.5,-76 35,-74.5 33.5,-73 C 25,-55 16,-34 2,-17 Z" 
            fill="url(#tasmRedGrad)" stroke="#ffffff" stroke-width="0.4" />

      <!-- PAIR 2 (UPPER-MID LEGS): Sweeping wide horizontally with distinct sharp TASM elbows -->
      <!-- Left Upper-Mid Leg -->
      <path d="M -6,-16 C -24,-24 -44,-32 -58,-34 C -60.5,-34.5 -61,-32.5 -59,-32 C -45,-26 -28,-18 -4,-11 Z" 
            fill="url(#tasmRedGrad)" stroke="#ffffff" stroke-width="0.4" />
      <!-- Right Upper-Mid Leg -->
      <path d="M 6,-16 C 24,-24 44,-32 58,-34 C 60.5,-34.5 61,-32.5 59,-32 C 45,-26 28,-18 4,-11 Z" 
            fill="url(#tasmRedGrad)" stroke="#ffffff" stroke-width="0.4" />

      <!-- PAIR 3 (LOWER-MID LEGS): Sweeping down and outward with long elegant needle points -->
      <!-- Left Lower-Mid Leg -->
      <path d="M -5,-8 C -22,8 -36,28 -44,58 C -45,61.5 -42.5,62 -41.5,59 C -32,32 -20,12 -3,-4 Z" 
            fill="url(#tasmRedGrad)" stroke="#ffffff" stroke-width="0.4" />
      <!-- Right Lower-Mid Leg -->
      <path d="M 5,-8 C 22,8 36,28 44,58 C 45,61.5 42.5,62 41.5,59 C 32,32 20,12 3,-4 Z" 
            fill="url(#tasmRedGrad)" stroke="#ffffff" stroke-width="0.4" />

      <!-- PAIR 4 (BOTTOM SIGNATURE TASM LEGS): Ultra-elongated needle legs extending far down -->
      <!-- Left Bottom Leg -->
      <path d="M -3,-2 C -10,22 -16,54 -18,88 C -18.5,91 -16,91 -15.5,88 C -13,54 -8,22 -1,0 Z" 
            fill="url(#tasmRedGrad)" stroke="#ffffff" stroke-width="0.4" />
      <!-- Right Bottom Leg -->
      <path d="M 3,-2 C 10,22 16,54 18,88 C 18.5,91 16,91 15.5,88 C 13,54 8,22 1,0 Z" 
            fill="url(#tasmRedGrad)" stroke="#ffffff" stroke-width="0.4" />
    </g>
  </g>
</svg>
